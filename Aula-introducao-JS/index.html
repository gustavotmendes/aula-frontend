<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Aula JS</title>
</head>

<body>
    <h1 class="text-center py-4">Introducao ao JavaScript</h1>
    <fieldset id="entrada">
        <legend>Dados do Usuario</legend>
        <input id="nome" type="text" placeholder="Nome">
        <input id="email" type="email" placeholder="Email">
        <input id="altura" type="number" placeholder="Altura">
        <button class="btn btn-primary" onclick="proc()">Processar Dados</button>
    </fieldset>
    <fieldset id="saida">
        <legend>Resultados</legend>
        <div id="resultado">
            <p>Aqui aparecerão os resultados</p>
        </div>
    </fieldset>
    <script src="/Aula-introducao-JS/js/scripts.js"></script>
</body> 

</html>
